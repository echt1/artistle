<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artistle – errate den Song deines Lieblingskünstlers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-noise"></div>

<header class="topbar">
  <div class="logo">artist<span>le</span></div>
  <button id="restartBtn" class="ghost-btn hidden">Neuer Künstler</button>
</header>

<main id="app">

  <!-- STEP 1: Artist suchen -->
  <section id="step-search" class="step active">
    <h1>Wähl deinen Künstler</h1>
    <p class="sub">Der komplette Songpool kommt nur von diesem Artist.</p>

    <form id="searchForm" class="search-row" autocomplete="off">
      <div class="autocomplete-wrap">
        <input id="artistInput" type="text" placeholder="z.B. bbno$, Ed Sheeran, ..." required />
        <div id="artistDropdown" class="suggestions artist-dropdown hidden"></div>
      </div>
      <button type="submit">Suchen</button>
    </form>

    <p id="searchStatus" class="status"></p>
  </section>

  <!-- STEP 2: Schwierigkeit -->
  <section id="step-difficulty" class="step">
    <div class="chosen-artist" id="chosenArtistCard"></div>
    <h2>Schwierigkeit wählen</h2>
    <div class="difficulty-grid">
      <button class="diff-btn" data-diff="easy">
        <strong>Leicht</strong>
        <span>Top-Hits des Artists</span>
      </button>
      <button class="diff-btn" data-diff="medium">
        <strong>Mittel</strong>
        <span>Bekannte, aber nicht die größten Hits</span>
      </button>
      <button class="diff-btn" data-diff="hard">
        <strong>Schwer</strong>
        <span>Deep Cuts aus dem gesamten Katalog</span>
      </button>
    </div>
    <p id="diffStatus" class="status"></p>
  </section>

  <!-- STEP 3: Game -->
  <section id="step-game" class="step">
    <div class="game-head">
      <div class="chosen-artist" id="gameArtistCard"></div>
      <div class="attempts" id="attemptsDisplay"></div>
    </div>

    <div class="player-card">
      <div class="waveform" id="waveform">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="player-controls">
        <button id="playBtn" class="play-btn" aria-label="Snippet abspielen">
          <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="snippet-info">
          <span id="currentSnippetLength">0.1s</span>
          <div class="snippet-dots" id="snippetDots"></div>
        </div>
      </div>
    </div>

    <form id="guessForm" class="guess-row" autocomplete="off">
      <div class="autocomplete-wrap">
        <input id="guessInput" type="text" placeholder="Songtitel eingeben (min. 4 Zeichen für Vorschläge)" />
        <div id="suggestions" class="suggestions hidden"></div>
      </div>
      <button type="submit">Raten</button>
      <button type="button" id="skipBtn" class="ghost-btn">Skip</button>
    </form>

    <ul id="guessHistory" class="guess-history"></ul>

    <div id="resultBanner" class="result-banner hidden"></div>

    <button id="nextRoundBtn" class="primary-btn hidden">Nächster Song</button>
  </section>

</main>

<audio id="audioPlayer" preload="none"></audio>

<script src="config.js"></script>
<script src="deezer.js"></script>
<script src="app.js"></script>
</body>
</html>
