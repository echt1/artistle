<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artistle – errate den Song deines Lieblingskünstlers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-noise"></div>

<header class="topbar">
  <div class="logo">artist<span>le</span></div>
  <button id="restartBtn" class="ghost-btn hidden">Neuer Künstler</button>
</header>

<main id="app">

  <!-- STEP 1: Artist suchen -->
  <section id="step-search" class="step active">
    <h1>Wähl deinen Künstler</h1>
    <p class="sub">Der komplette Songpool kommt nur von diesem Artist.</p>

    <form id="searchForm" class="search-row" autocomplete="off">
      <div class="autocomplete-wrap">
        <input id="artistInput" type="text" placeholder="z.B. bbno$, Ed Sheeran, ..." required />
        <div id="artistDropdown" class="suggestions artist-dropdown hidden"></div>
      </div>
      <button type="submit">Suchen</button>
    </form>

    <p id="searchStatus" class="status"></p>
  </section>

  <!-- STEP 2: Game -->
  <section id="step-game" class="step">
    <div class="game-head">
      <div class="chosen-artist" id="gameArtistCard"></div>
      <div class="attempt-counter" id="attemptCounter"></div>
    </div>

    <div class="player-card">
      <div class="timeline" id="timeline">
        <div class="timeline-track">
          <div class="timeline-fill" id="timelineFill"></div>
          <div class="timeline-playhead" id="timelinePlayhead"></div>
        </div>
        <div class="timeline-ticks" id="timelineTicks"></div>
      </div>

      <div class="player-controls">
        <button id="playBtn" class="play-btn" aria-label="Snippet abspielen" disabled>
          <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="snippet-info">
          <span class="snippet-info-label">Ausschnitt</span>
          <span id="currentSnippetLength">0.1s</span>
        </div>
      </div>

      <p id="gameStatus" class="status"></p>
    </div>

    <form id="guessForm" class="guess-row" autocomplete="off">
      <div class="autocomplete-wrap">
        <input id="guessInput" type="text" placeholder="Songtitel eingeben (min. 4 Zeichen für Vorschläge)" disabled />
        <div id="suggestions" class="suggestions hidden"></div>
      </div>
      <button type="submit" disabled>Raten</button>
      <button type="button" id="skipBtn" class="ghost-btn" disabled>Skip</button>
    </form>

    <ul id="guessHistory" class="guess-history"></ul>

    <div id="resultBanner" class="result-banner hidden"></div>

    <button id="nextRoundBtn" class="primary-btn hidden">Nächster Song</button>
  </section>

</main>

<!-- Unsichtbarer YouTube-Player: liefert den echten Vollton, wir steuern
     nur Start/Stop. Bewusst nicht display:none, sonst pausiert YouTube
     die Wiedergabe in manchen Browsern. -->
<div id="ytPlayer" class="yt-player-hidden"></div>
<script src="https://www.youtube.com/iframe_api"></script>

<script src="config.js"></script>
<script src="deezer.js"></script>
<script src="youtube.js"></script>
<script src="app.js"></script>
</body>
</html>
